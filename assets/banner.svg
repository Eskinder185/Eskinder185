<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Eskinder Kassahun — Software, cloud and security</title>
<desc id="desc">Navy developer banner with cyan orbital paths and violet accents.</desc>
<defs><radialGradient id="glow"><stop stop-color="#262257"/><stop offset="1" stop-color="#0b1020"/></radialGradient><linearGradient id="line"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#26334c" stroke-width=".6"/></pattern></defs>
<style>@keyframes drift{to{stroke-dashoffset:-100}}.orbit{animation:drift 16s linear infinite}@media(prefers-reduced-motion:reduce){.orbit{animation:none}}text{font-family:system-ui,-apple-system,sans-serif}</style>
